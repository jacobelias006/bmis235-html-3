<div class="showcase">
  <!-- HTML: the play area where the names bounce around -->
<div class="rm-stage" aria-label="Roommate names bouncing around">
  <div class="rm-hint">Tap a name to give it a kick</div>
</div>

<!-- CSS: brand styling for the play area and the name bubbles (every rule starts with .showcase) -->
<style>
  .showcase .rm-stage {
    position: relative;
    width: 100%;
    height: min(380px, 80vh);
    overflow: hidden;
    box-sizing: border-box;
    background: #FFE5B4;
    border: 3px solid #2b2b2b;
    border-radius: 16px;
    font-family: Cambria, Georgia, serif;
    touch-action: manipulation;
  }
  .showcase .rm-name {
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    padding: 0.5em 1em;
    background: #2b2b2b;
    color: #FFE5B4;
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: clamp(16px, 4.5vw, 26px);
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    will-change: transform;
  }
  .showcase .rm-name:focus-visible {
    outline: 3px solid #2b2b2b;
    outline-offset: 3px;
  }
  .showcase .rm-hint {
    position: absolute;
    bottom: 10px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: #2b2b2b;
    opacity: 0.7;
    pointer-events: none;
  }
</style>

<!-- JavaScript: creates a bubble for each name, bounces it off the walls, and kicks it faster when tapped -->
<script>
  (function () {
    var root = document.currentScript
      ? document.currentScript.closest('.showcase')
      : document.querySelector('.showcase');
    if (!root) return;
    var stage = root.querySelector('.rm-stage');

    // Edit these names:
    var NAMES = ['Jacob', 'Isaac', 'Conor', 'Jamo'];

    var reduceMotion = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var items = [];

    NAMES.forEach(function (name) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'rm-name';
      el.textContent = name;
      stage.appendChild(el);
      var item = { el: el, x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0, base: 0 };
      el.addEventListener('click', function () {
        if (reduceMotion) return;
        var angle = Math.random() * Math.PI * 2;
        var kick = item.base * 3.5;
        item.vx = Math.cos(angle) * kick;
        item.vy = Math.sin(angle) * kick;
      });
      items.push(item);
    });

    function measure() {
      var W = stage.clientWidth;
      var H = stage.clientHeight;
      items.forEach(function (it) {
        it.w = it.el.offsetWidth;
        it.h = it.el.offsetHeight;
        it.x = Math.min(it.x, Math.max(0, W - it.w));
        it.y = Math.min(it.y, Math.max(0, H - it.h));
      });
    }

    function place() {
      var W = stage.clientWidth;
      var H = stage.clientHeight;
      items.forEach(function (it) {
        it.w = it.el.offsetWidth;
        it.h = it.el.offsetHeight;
        it.x = Math.random() * Math.max(1, W - it.w);
        it.y = Math.random() * Math.max(1, H - it.h);
        var angle = Math.random() * Math.PI * 2;
        it.base = 1.4 + Math.random() * 0.8;
        it.vx = Math.cos(angle) * it.base;
        it.vy = Math.sin(angle) * it.base;
        it.el.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px)';
      });
    }

    function tick() {
      var W = stage.clientWidth;
      var H = stage.clientHeight;
      items.forEach(function (it) {
        it.x += it.vx;
        it.y += it.vy;
        if (it.x <= 0) { it.x = 0; it.vx = Math.abs(it.vx); }
        else if (it.x >= W - it.w) { it.x = W - it.w; it.vx = -Math.abs(it.vx); }
        if (it.y <= 0) { it.y = 0; it.vy = Math.abs(it.vy); }
        else if (it.y >= H - it.h) { it.y = H - it.h; it.vy = -Math.abs(it.vy); }

        // after a kick, slowly settle back to normal speed
        var speed = Math.sqrt(it.vx * it.vx + it.vy * it.vy);
        if (speed > it.base * 1.02) {
          it.vx *= 0.985;
          it.vy *= 0.985;
        }
        it.el.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px)';
      });
      requestAnimationFrame(tick);
    }

    place();
    window.addEventListener('resize', measure);
    if (!reduceMotion) requestAnimationFrame(tick);
  })();
</script>
